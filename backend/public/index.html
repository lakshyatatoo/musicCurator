<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify Analyzer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: monospace;
        background: #1a1a1a;
        color: #0f0;
        padding: 20px;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
      }
      h1 {
        margin-bottom: 20px;
      }
      .section {
        background: #222;
        padding: 15px;
        margin-bottom: 15px;
        border: 1px solid #333;
      }
      .section h2 {
        color: #0f0;
        margin-bottom: 10px;
        font-size: 14px;
      }
      input {
        background: #333;
        border: 1px solid #555;
        color: #0f0;
        padding: 8px;
        width: 200px;
        margin-right: 10px;
      }
      button {
        background: #0f0;
        color: #000;
        border: none;
        padding: 8px 16px;
        cursor: pointer;
        font-family: monospace;
        font-weight: bold;
      }
      button:hover {
        background: #0a0;
      }
      button:disabled {
        background: #555;
        cursor: not-allowed;
      }
      #log {
        background: #111;
        padding: 10px;
        height: 400px;
        overflow-y: auto;
        font-size: 12px;
        border: 1px solid #333;
      }
      .log-entry {
        margin-bottom: 5px;
      }
      .log-entry.success {
        color: #0f0;
      }
      .log-entry.error {
        color: #f00;
      }
      .log-entry.info {
        color: #0ff;
      }
      .log-entry.warning {
        color: #ff0;
      }
      .btn-group {
        margin-top: 10px;
      }
      .btn-group button {
        margin-right: 10px;
      }
      #result {
        white-space: pre-wrap;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>[ musicCurator ]</h1>

      <div class="section">
        <h2>AUTH</h2>
        <input
          type="text"
          id="username"
          placeholder="username"
          value="testuser"
        />
        <input
          type="password"
          id="password"
          placeholder="password"
          value="password123"
        />
        <button onclick="register()">Register</button>
        <button onclick="login()">Login</button>
        <button onclick="logout()">Logout</button>
      </div>

      <div class="section">
        <h2>SPOTIFY</h2>
        <div class="btn-group">
          <button onclick="connectSpotify()">Connect Spotify</button>
          <button onclick="analyze()">Analyze</button>
        </div>
      </div>

      <div class="section">
        <h2>LOG</h2>
        <div id="log"></div>
      </div>

      <div class="section">
        <h2>RESULT</h2>
        <div id="result">Waiting...</div>
      </div>
    </div>

    <script>
      const logEl = document.getElementById("log");
      const resultEl = document.getElementById("result");

      function log(msg, type = "info") {
        const entry = document.createElement("div");
        entry.className = `log-entry ${type}`;
        entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logEl.appendChild(entry);
        logEl.scrollTop = logEl.scrollHeight;
      }

      async function api(method, path, body = null) {
        try {
          const options = {
            method,
            credentials: "include",
            headers: { "Content-Type": "application/json" },
          };
          if (body) options.body = JSON.stringify(body);
          const res = await fetch(path, options);
          const data = await res.json();
          log(
            `${method} ${path} -> ${res.status}`,
            res.ok ? "success" : "error",
          );
          return { status: res.status, data };
        } catch (err) {
          log(`Error: ${err.message}`, "error");
          return { status: 0, data: { message: err.message } };
        }
      }

      async function register() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        log("Registering...", "info");
        const res = await api("POST", "/api/auth/register", {
          username,
          email: `${username}@test.com`,
          password,
        });
        log(
          JSON.stringify(res.data),
          res.status === 201 ? "success" : "warning",
        );
      }

      async function login() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        log("Logging in...", "info");
        const res = await api("POST", "/api/auth/login", {
          username,
          password,
        });
        log(
          JSON.stringify(res.data),
          res.status === 200 ? "success" : "warning",
        );
      }

      async function logout() {
        log("Logging out...", "info");
        const res = await api("POST", "/api/auth/logout");
        log(JSON.stringify(res.data), "success");
      }

      async function connectSpotify() {
        log("Getting Spotify auth URL...", "info");
        const res = await api("GET", "/api/spotify/connect");
        if (res.data.authUrl) {
          log("Opening Spotify authorization...", "warning");
          window.open(res.data.authUrl, "_blank");
          log(
            "Authorize in the new tab, then come back and click Analyze",
            "warning",
          );
        } else {
          log(JSON.stringify(res.data), "error");
        }
      }

      async function analyze() {
        log("Running analysis... (this may take 10-20 seconds)", "info");
        resultEl.textContent = "Loading...";
        const res = await api("GET", "/api/spotify/analyze");
        if (res.status === 200) {
          log("Analysis complete!", "success");
          resultEl.textContent = JSON.stringify(res.data, null, 2);
        } else {
          log(JSON.stringify(res.data), "error");
          resultEl.textContent = JSON.stringify(res.data, null, 2);
        }
      }

      log("Ready. Register or login first, then connect Spotify.", "info");
    </script>
  </body>
</html>
